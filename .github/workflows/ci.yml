name: CI

# CI is paused: GitHub-hosted runners do not yet provide macOS 27, which this
# project requires (MACOSX_DEPLOYMENT_TARGET = 27.0, Xcode 27 SDK). The build
# job below is retained but only runs on manual dispatch. Restore the
# `pull_request` and `push` triggers once macos-27 runners are available.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PROJECT: "LocalCut Studio.xcodeproj"
      SCHEME: "LocalCut Studio"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Debug build for macOS. Code signing is disabled so CI needs no
      # certificates. When a LocalCut StudioTests target exists, switch `build` to
      # `test` and add `-resultBundlePath`.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
