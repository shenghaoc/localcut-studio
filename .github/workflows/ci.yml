name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".kiro/**"
      - ".jules/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  portable-domain-test:
    name: Test (LocalCutDomain / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-swift v2.4.0 supports modern Swift on Linux, but its hard-coded
      # Windows catalog stops at Swift 5.6. Use it only where it is current.
      - name: Set up Swift 6.2.1 (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.2.1"

      # Swift.org's supported Windows installation path. The hosted image
      # already includes Visual Studio 2022 and the Windows SDK prerequisites.
      - name: Set up current Swift (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain --exact --source winget `
            --accept-source-agreements --accept-package-agreements `
            --disable-interactivity

          # WinGet updates the machine PATH, but the runner process predates
          # that update. Export its entries for subsequent workflow steps.
          [Environment]::GetEnvironmentVariable('Path', 'Machine').Split(';') |
            Where-Object { $_ } |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show portable toolchain
        run: swift --version

      - name: Cache portable package build
        uses: actions/cache@v6
        with:
          path: Packages/LocalCutCore/.build
          key: localcutdomain-${{ runner.os }}-swift6-${{ hashFiles('Packages/LocalCutCore/Package.swift', 'Packages/LocalCutCore/Sources/LocalCutDomain/**/*.swift', 'Packages/LocalCutCore/Tests/LocalCutDomainTests/**/*.swift') }}
          restore-keys: |
            localcutdomain-${{ runner.os }}-swift6-

      - name: Build and test portable domain
        run: swift test --package-path Packages/LocalCutCore

  package-test:
    name: Test (LocalCutCore package)
    runs-on: macos-26
    timeout-minutes: 15

    env:
      PACKAGE_PATH: Packages/LocalCutCore

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache LocalCutCore build
        uses: actions/cache@v6
        with:
          path: Packages/LocalCutCore/.build
          key: localcutcore-${{ runner.os }}-${{ hashFiles('Packages/LocalCutCore/Package.swift', 'Packages/LocalCutCore/Sources/**/*.swift', 'Packages/LocalCutCore/Tests/**/*.swift') }}
          restore-keys: |
            localcutcore-${{ runner.os }}-

      - name: Validate core/app layer boundary
        run: ./Scripts/validate-layer-boundaries.sh

      - name: Run package tests
        run: swift test --package-path "$PACKAGE_PATH"

      # OTIO validation is independent of the Xcode build. Running it in this
      # shorter parallel job removes it from the macOS test critical path.
      - name: Restore OTIO validator venv
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/localcut-otio-validator-0.17.0
          key: otio-validator-${{ runner.os }}-0.17.0

      - name: Validate OTIO goldens
        env:
          OTIO_VALIDATOR_VENV: ${{ runner.temp }}/localcut-otio-validator-0.17.0
        run: ./Scripts/validate-otio-goldens.sh

  test:
    name: Test (macOS 26 / Xcode)
    runs-on: macos-26
    timeout-minutes: 30

    env:
      PROJECT: "LocalCut Studio.xcodeproj"
      SCHEME: "LocalCut Studio"
      RESULT_BUNDLE: TestResults.xcresult
      DERIVED_DATA: DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version
          sw_vers

      - name: Restore DerivedData cache
        id: deriveddata-cache
        uses: actions/cache/restore@v6
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-webrtc-${{ hashFiles('**/*.swift', '**/Package.swift', '**/Package.resolved', '**/*.pbxproj', '**/*.xcconfig') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-webrtc-

      - name: Build and test (with flake detection)
        run: ./Scripts/run-xcode-tests-with-flake-detection.sh

      # Run MediaMTX integration tests separately so they are not subject
      # to the flake-detection retry loop (a real integration failure should
      # not be masked by a retry pass).
      - name: MediaMTX WHIP integration
        run: ./Scripts/run-mediamtx-whip-integration.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-diagnostics
          path: |
            xcodebuild.log
            TestResults.xcresult
            flaky-report.json
            retry-*.log
            suite-confirmation-*.log
            .build/mediamtx/mediamtx.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-test-report
          path: flaky-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Save DerivedData cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deriveddata-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-webrtc-${{ hashFiles('**/*.swift', '**/Package.swift', '**/Package.resolved', '**/*.pbxproj', '**/*.xcconfig') }}

  build-non-webrtc:
    name: Test (non-WebRTC stubs)
    runs-on: macos-26
    timeout-minutes: 30

    env:
      PROJECT: "LocalCut Studio.xcodeproj"
      SCHEME: "LocalCut Studio"
      RESULT_BUNDLE: TestResults.xcresult
      DERIVED_DATA: DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore DerivedData cache
        id: deriveddata-cache
        uses: actions/cache/restore@v6
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-nonwebrtc-${{ hashFiles('**/*.swift', '**/Package.swift', '**/Package.resolved', '**/*.pbxproj', '**/*.xcconfig') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-nonwebrtc-

      # Runs the focused publish suite for the non-WebRTC stub path.
      # The nonWebRTCVideoTapStoresLatestFrame test exercises the stub
      # VideoPublishTap; the WebRTC-enabled test job covers the real path.
      - name: Test without WebRTC
        run: |
          set -o pipefail
          rm -rf "$RESULT_BUNDLE"

          # Strip LOCALCUT_ENABLE_WEBRTC from the project-level setting
          # so the #if !LOCALCUT_ENABLE_WEBRTC stub paths are compiled.
          # Keep the same per-test timeout as the WebRTC-enabled lane so a
          # hung stub-path test cannot consume the whole 30-minute job.
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -packageAuthorizationProvider netrc \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:"LocalCut StudioTests/WhipPublishTests" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            | tee xcodebuild.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-non-webrtc-diagnostics
          path: |
            xcodebuild.log
            TestResults.xcresult
            DerivedData/Build/Logs/Build/*.xcactivitylog
          if-no-files-found: warn
          retention-days: 7

      - name: Save DerivedData cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deriveddata-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-nonwebrtc-${{ hashFiles('**/*.swift', '**/Package.swift', '**/Package.resolved', '**/*.pbxproj', '**/*.xcconfig') }}
