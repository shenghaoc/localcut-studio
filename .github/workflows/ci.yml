name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".kiro/**"
      - ".jules/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  package-test:
    name: Test (LocalCutCore package)
    runs-on: macos-26
    timeout-minutes: 15

    env:
      PACKAGE_PATH: Packages/LocalCutCore

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Run package tests
        run: swift test --package-path "$PACKAGE_PATH"

  test:
    name: Test (macOS 26 / Xcode)
    runs-on: macos-26
    timeout-minutes: 30
    # The pure-logic package tests are the fast loop — gate the expensive
    # Xcode build/test on them so a broken engine fails in seconds, not minutes.
    needs: package-test

    env:
      PROJECT: "LocalCut Studio.xcodeproj"
      SCHEME: "LocalCut Studio"
      RESULT_BUNDLE: TestResults.xcresult
      DERIVED_DATA: DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version
          sw_vers

      - name: Cache WebRTC XCFramework
        uses: actions/cache@v4
        with:
          path: Packages/LocalCutWebRTC/WebRTC.xcframework
          key: webrtc-xcframework-140.0.0

      - name: Download WebRTC XCFramework
        run: ./Packages/LocalCutWebRTC/Scripts/download-webrtc.sh

      - name: Validate Xcode project
        run: |
          xcodebuild -list -project "$PROJECT"

      - name: Build and test
        run: |
          set -o pipefail
          rm -rf "$RESULT_BUNDLE" "$DERIVED_DATA"

          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Validate OTIO goldens
        run: ./Scripts/validate-otio-goldens.sh

      - name: MediaMTX WHIP integration
        run: LOCALCUT_REQUIRE_MEDIAMTX_INTEGRATION=1 ./Scripts/run-mediamtx-whip-integration.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-diagnostics
          path: |
            xcodebuild.log
            TestResults.xcresult
          if-no-files-found: warn
          retention-days: 7

  build-non-webrtc:
    name: Test (non-WebRTC stubs)
    runs-on: macos-26
    timeout-minutes: 30
    needs: package-test

    env:
      PROJECT: "LocalCut Studio.xcodeproj"
      SCHEME: "LocalCut Studio"
      RESULT_BUNDLE: TestResults.xcresult
      DERIVED_DATA: DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version
          sw_vers

      # SPM resolves the LocalCutWebRTC package unconditionally; the XCFramework
      # binary target must exist on disk even though we compile without the
      # LOCALCUT_ENABLE_WEBRTC flag so the stub code paths are exercised.
      - name: Cache WebRTC XCFramework
        uses: actions/cache@v4
        with:
          path: Packages/LocalCutWebRTC/WebRTC.xcframework
          key: webrtc-xcframework-140.0.0

      - name: Download WebRTC XCFramework
        run: ./Packages/LocalCutWebRTC/Scripts/download-webrtc.sh

      - name: Validate Xcode project
        run: |
          xcodebuild -list -project "$PROJECT"

      # Runs tests to validate the non-WebRTC stub paths at runtime.
      # The nonWebRTCVideoTapStoresLatestFrame test exercises the stub
      # VideoPublishTap; the WebRTC-enabled test job covers the real path.
      - name: Test without WebRTC
        run: |
          set -o pipefail
          rm -rf "$RESULT_BUNDLE" "$DERIVED_DATA"

          # Strip LOCALCUT_ENABLE_WEBRTC from the project-level setting
          # so the #if !LOCALCUT_ENABLE_WEBRTC stub paths are compiled.
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            | tee xcodebuild.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-non-webrtc-diagnostics
          path: |
            xcodebuild.log
            TestResults.xcresult
            DerivedData/Build/Logs/Build/*.xcactivitylog
          if-no-files-found: warn
          retention-days: 7
