name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".kiro/**"
      - ".jules/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  portable-domain-test:
    name: Test (LocalCutDomain / Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ubuntu-24.04 provides Swift 6.3.3, matching the proven CI setup in
      # rowplay-studio#46 and runplay-studio#28 without a setup action.
      - name: Verify Swift version
        run: swift --version

      - name: Cache portable package build
        uses: actions/cache@v6
        with:
          path: Packages/LocalCutCore/.build
          key: localcutdomain-${{ runner.os }}-swift-6.3.3-${{ hashFiles('Packages/LocalCutCore/Package.swift', 'Packages/LocalCutCore/Sources/LocalCutDomain/**/*.swift', 'Packages/LocalCutCore/Tests/LocalCutDomainTests/**/*.swift') }}
          restore-keys: |
            localcutdomain-${{ runner.os }}-swift-6.3.3-

      - name: Build and test portable domain
        run: swift test --package-path Packages/LocalCutCore

  package-test:
    name: Test (LocalCutCore package)
    runs-on: macos-26
    timeout-minutes: 15

    env:
      PACKAGE_PATH: Packages/LocalCutCore

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache LocalCutCore build
        uses: actions/cache@v6
        with:
          path: Packages/LocalCutCore/.build
          key: localcutcore-${{ runner.os }}-${{ hashFiles('Packages/LocalCutCore/Package.swift', 'Packages/LocalCutCore/Sources/**/*.swift', 'Packages/LocalCutCore/Tests/**/*.swift') }}
          restore-keys: |
            localcutcore-${{ runner.os }}-

      - name: Validate core/app layer boundary
        run: ./Scripts/validate-layer-boundaries.sh

      - name: Build macOS platform layer
        run: swift build --package-path "$PACKAGE_PATH" --target LocalCutPlatform

      - name: Run package tests
        run: swift test --package-path "$PACKAGE_PATH"

      # OTIO validation is independent of the Xcode build. Running it in this
      # shorter parallel job removes it from the macOS test critical path.
      - name: Restore OTIO validator venv
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/localcut-otio-validator-0.17.0
          key: otio-validator-${{ runner.os }}-0.17.0

      - name: Validate OTIO goldens
        env:
          OTIO_VALIDATOR_VENV: ${{ runner.temp }}/localcut-otio-validator-0.17.0
        run: ./Scripts/validate-otio-goldens.sh

  test:
    name: Test (macOS 26 / Xcode)
    runs-on: macos-26
    timeout-minutes: 30

    env:
      PROJECT: "LocalCut Studio.xcodeproj"
      SCHEME: "LocalCut Studio"
      RESULT_BUNDLE: TestResults.xcresult
      DERIVED_DATA: DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version
          sw_vers

      - name: Restore DerivedData cache
        id: deriveddata-cache
        uses: actions/cache/restore@v6
        with:
          path: DerivedData
          # Source-only changes can safely reuse the main-branch cache; Xcode
          # invalidates changed objects. Package/project graph changes must
          # miss exactly, because restoring modules built from an older graph
          # can expose duplicate package products under Xcode 26.5.
          key: deriveddata-${{ runner.os }}-v2-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.pbxproj', '**/*.xcconfig') }}

      - name: Build and test (with flake detection)
        run: ./Scripts/run-xcode-tests-with-flake-detection.sh

      # Run MediaMTX integration tests separately so they are not subject
      # to the flake-detection retry loop (a real integration failure should
      # not be masked by a retry pass).
      - name: MediaMTX WHIP integration
        run: ./Scripts/run-mediamtx-whip-integration.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-diagnostics
          path: |
            xcodebuild.log
            TestResults.xcresult
            flaky-report.json
            retry-*.log
            suite-confirmation-*.log
            .build/mediamtx/mediamtx.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-test-report
          path: flaky-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Save DerivedData cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deriveddata-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-v2-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.pbxproj', '**/*.xcconfig') }}
