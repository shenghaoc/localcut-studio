name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".kiro/**"
      - ".jules/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  package-test:
    name: Test (LocalCutCore package)
    runs-on: macos-26
    timeout-minutes: 15

    env:
      PACKAGE_PATH: Packages/LocalCutCore

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run package tests
        run: swift test --package-path "$PACKAGE_PATH"

  test:
    name: Test (macOS 26 / Xcode)
    runs-on: macos-26
    timeout-minutes: 30

    env:
      PROJECT: "LocalCut Studio.xcodeproj"
      SCHEME: "LocalCut Studio"
      RESULT_BUNDLE: TestResults.xcresult
      DERIVED_DATA: DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version
          sw_vers

      - name: Cache WebRTC XCFramework
        uses: actions/cache@v6
        with:
          path: Packages/LocalCutWebRTC/WebRTC.xcframework
          key: webrtc-xcframework-140.0.0

      - name: Prepare WebRTC XCFramework
        run: ./Packages/LocalCutWebRTC/Scripts/download-webrtc.sh

      - name: Restore DerivedData cache
        id: deriveddata-cache
        uses: actions/cache/restore@v6
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-webrtc-${{ hashFiles('**/*.swift', '**/Package.swift', '**/Package.resolved', '**/*.pbxproj', '**/*.xcconfig') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-webrtc-

      - name: Build and test (with flake detection)
        run: ./Scripts/run-xcode-tests-with-flake-detection.sh

      # Run MediaMTX integration tests separately so they are not subject
      # to the flake-detection retry loop (a real integration failure should
      # not be masked by a retry pass).
      - name: MediaMTX WHIP integration
        run: ./Scripts/run-mediamtx-whip-integration.sh

      - name: Restore OTIO validator venv
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/localcut-otio-validator-0.17.0
          key: otio-validator-${{ runner.os }}-0.17.0

      - name: Validate OTIO goldens
        env:
          OTIO_VALIDATOR_VENV: ${{ runner.temp }}/localcut-otio-validator-0.17.0
        run: ./Scripts/validate-otio-goldens.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-diagnostics
          path: |
            xcodebuild.log
            TestResults.xcresult
            flaky-report.json
            retry-*.log
            suite-confirmation-*.log
            .build/mediamtx/mediamtx.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-test-report
          path: flaky-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Save DerivedData cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deriveddata-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-webrtc-${{ hashFiles('**/*.swift', '**/Package.swift', '**/Package.resolved', '**/*.pbxproj', '**/*.xcconfig') }}

  build-non-webrtc:
    name: Test (non-WebRTC stubs)
    runs-on: macos-26
    timeout-minutes: 30

    env:
      PROJECT: "LocalCut Studio.xcodeproj"
      SCHEME: "LocalCut Studio"
      RESULT_BUNDLE: TestResults.xcresult
      DERIVED_DATA: DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SPM resolves the LocalCutWebRTC package unconditionally; the XCFramework
      # binary target must exist on disk even though we compile without the
      # LOCALCUT_ENABLE_WEBRTC flag so the stub code paths are exercised.
      - name: Cache WebRTC XCFramework
        uses: actions/cache@v6
        with:
          path: Packages/LocalCutWebRTC/WebRTC.xcframework
          key: webrtc-xcframework-140.0.0

      - name: Prepare WebRTC XCFramework
        run: ./Packages/LocalCutWebRTC/Scripts/download-webrtc.sh

      - name: Restore DerivedData cache
        id: deriveddata-cache
        uses: actions/cache/restore@v6
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-nonwebrtc-${{ hashFiles('**/*.swift', '**/Package.swift', '**/Package.resolved', '**/*.pbxproj', '**/*.xcconfig') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-nonwebrtc-

      # Runs the focused publish suite for the non-WebRTC stub path.
      # The nonWebRTCVideoTapStoresLatestFrame test exercises the stub
      # VideoPublishTap; the WebRTC-enabled test job covers the real path.
      - name: Test without WebRTC
        run: |
          set -o pipefail
          rm -rf "$RESULT_BUNDLE"

          # Strip LOCALCUT_ENABLE_WEBRTC from the project-level setting
          # so the #if !LOCALCUT_ENABLE_WEBRTC stub paths are compiled.
          # Keep the same per-test timeout as the WebRTC-enabled lane so a
          # hung stub-path test cannot consume the whole 30-minute job.
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:"LocalCut StudioTests/WhipPublishTests" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            | tee xcodebuild.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-non-webrtc-diagnostics
          path: |
            xcodebuild.log
            TestResults.xcresult
            DerivedData/Build/Logs/Build/*.xcactivitylog
          if-no-files-found: warn
          retention-days: 7

      - name: Save DerivedData cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deriveddata-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-nonwebrtc-${{ hashFiles('**/*.swift', '**/Package.swift', '**/Package.resolved', '**/*.pbxproj', '**/*.xcconfig') }}
