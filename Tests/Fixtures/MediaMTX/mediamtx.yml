# MediaMTX configuration for LocalCut WHIP integration testing.
# Minimal config: WHIP ingest on port 8889, no auth, local only.

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: 0.0.0.0
apiPort: 9997

webrtc: yes
webrtcAddress: 0.0.0.0
webrtcPort: 8889
webrtcEncryption: no
webrtcAllowOrigin: "*"

paths:
  all_others:
